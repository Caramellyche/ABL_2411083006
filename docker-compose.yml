services:
  eureka-service:
    build:
      context: ./test # Sesuaikan dengan nama folder project Anda
      dockerfile: Dockerfile
    container_name: eureka-container
    ports:
      - "8761:8761"
    networks:
      - spring-microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  api-gateway:
    build:
      context: ./api-gateway # Sesuaikan dengan nama folder gateway Anda
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in your environment or .env}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-service:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
    depends_on:
      - eureka-service
    restart: on-failure
    networks:
      - spring-microservices-net

  produk-service:
    build:
      context: ./product
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "8081:8081"
    expose:
      - "8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-service:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
    depends_on:
      - eureka-service
    restart: on-failure
    networks:
      - spring-microservices-net

networks:
  spring-microservices-net:
    driver: bridge
